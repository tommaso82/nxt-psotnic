name: NXT Config Crypto
on:
  push:
    branches: [devel, 'test/optional-nxtcrypt']
  pull_request:
    paths:
      - 'nxt-crypto.*'
      - 'nxt-legacy.*'
      - 'nxt-file.*'
      - 'nxt-proxy.*'
      - 'class-client.cpp'
      - 'class-ent.cpp'
      - 'class-ent.h'
      - 'tests/test-nxt-proxy.cpp'
      - 'tests/test-nxt-proxy-integration.py'
      - 'tests/test-nxt-debug-foreground.py'
      - 'tests/test-nxt-wizard.py'
      - 'tests/userlist-bootstrap-test.cpp'
      - 'tests/test-userlist-bootstrap-live.py'
      - 'config-create.cpp'
      - 'global-var.h'
      - 'class-userlist.cpp'
      - 'class-inet.cpp'
      - 'main.cpp'
      - 'tests/ul-session-test.cpp'
      - 'tests/test-classic-upstream.sh'
      - 'tests/legacy-fixture.cpp'
      - 'tests/test-nxt-legacy.sh'
      - 'config-load.cpp'
      - 'class-options.cpp'
      - 'classes.h'
      - 'functions.cpp'
      - 'defines.h'
      - 'tests/test-nxt-banner.py'
      - 'configure'
      - 'tests/test.pm'
      - 'tests/sodium.c'
      - 'tests/test-nxt-crypto.sh'
      - 'tests/nxt-crypto-cli-test.cpp'
      - 'tests/cfg-session-test.cpp'
      - 'tests/test-nxt-cfg-session.sh'
      - 'tests/key-cache-test.cpp'
      - '.github/workflows/nxt-config-crypto.yml'
jobs:
  core-no-sodium:
    name: Plaintext and legacy import without libsodium
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile core without libsodium
        run: |
          test -x ./configure
          ./configure --help | grep -q -- '--enable-nxtcrypt'
          ./configure --disable-modules --disable-adns
          make dynamic
          ! grep -q -- '-lsodium' Makefile.dynamic
      - name: Verify CLI, import availability and encrypted-file rejection
        run: |
          ./bin/psotnic --help | grep -q 'config'
          ./bin/psotnic config import --help | grep -q 'Legacy'
          for opt in --key-cache --password-file --password-stdin --password; do
            if ./bin/psotnic "$opt" > /tmp/nxt-unsupported-out 2>&1; then exit 1; fi
            grep -q 'NXTCRYPT support was not compiled in' /tmp/nxt-unsupported-out
          done
          if ./bin/psotnic config encrypt missing --output out.nxt; then exit 1; fi
          ./bin/psotnic config import nonexistent --seed-file none --to nxt --output out.nxt > /tmp/unsupported.log 2>&1 && exit 1
          grep -q 'not compiled in' /tmp/unsupported.log
      - name: Verify real legacy Blowfish import without libsodium
        run: |
          g++ -std=c++11 -O2 -I. class-blowfish.cpp tests/legacy-fixture.cpp -o /tmp/nxt-plain-legacy-fixture
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          /tmp/nxt-plain-legacy-fixture "$tmp/old.cfg"
          printf '# legacy fixture\nnick legacybot\nsasl-password legacysecret\nrealname Legacy Fixture\n' > "$tmp/expected.cfg"
          ./bin/psotnic config import "$tmp/old.cfg" --seed-file tests/fixtures/legacy-seed.h --output "$tmp/imported.cfg"
          cmp "$tmp/expected.cfg" "$tmp/imported.cfg"
          ./bin/psotnic config import "$tmp/old.cfg" --binary /tmp/nxt-plain-legacy-fixture --preview > "$tmp/preview.cfg"
          cmp "$tmp/expected.cfg" "$tmp/preview.cfg"
          test "$(stat -c %a "$tmp/imported.cfg")" = 600
      - name: Plaintext wizard, banner, foreground and proxy integration
        run: |
          python3 tests/test-nxt-wizard.py ./bin/psotnic --plaintext-only
          python3 tests/test-nxt-banner.py ./bin/psotnic
          python3 tests/test-nxt-debug-foreground.py ./bin/psotnic
          python3 tests/test-nxt-proxy-integration.py ./bin/psotnic
      - name: Validate case-insensitive encrypted extension protection
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'nick legacybot\n' > "$tmp/plain.cfg"
          if ./bin/psotnic config import "$tmp/plain.cfg" --seed-file tests/fixtures/legacy-seed.h --output "$tmp/reject.NXT" > "$tmp/err" 2>&1; then exit 1; fi
          grep -q 'not compiled in' "$tmp/err"
          test ! -e "$tmp/reject.NXT"
  crypto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config build-essential perl
      - name: Configure for generated headers
        run: perl configure --enable-nxtcrypt --disable-modules
      - name: Build standalone crypto CLI and fixture executables
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -I. -DHAVE_NXTCRYPT nxt-crypto.cpp nxt-file.cpp nxt-legacy.cpp class-blowfish.cpp tests/nxt-crypto-cli-test.cpp $(pkg-config --cflags --libs libsodium) -o /tmp/nxt-crypto-test
          g++ -std=c++11 -O2 -Wall -Wextra -I. -DHAVE_NXTCRYPT nxt-crypto.cpp nxt-file.cpp nxt-legacy.cpp class-blowfish.cpp tests/cfg-session-test.cpp $(pkg-config --cflags --libs libsodium) -o /tmp/nxt-cfg-session-test
          g++ -std=c++11 -O2 -Wall -Wextra -I. -DHAVE_NXTCRYPT nxt-crypto.cpp nxt-file.cpp nxt-legacy.cpp class-blowfish.cpp tests/userlist-bootstrap-test.cpp $(pkg-config --cflags --libs libsodium) -o /tmp/nxt-ul-bootstrap-test
          for opt in 0 1 2; do
            g++ -std=c++11 -O"$opt" -I. class-blowfish.cpp tests/legacy-fixture.cpp -o "/tmp/old-psotnic-$opt"
          done
      - name: Roundtrip, tamper, overwrite, permission and stdin checks
        run: sh tests/test-nxt-crypto.sh /tmp/nxt-crypto-test
      - name: Cached-key encrypted .cfg-save, salt unchanged and nonce rotated
        run: sh tests/test-nxt-cfg-session.sh /tmp/nxt-crypto-test /tmp/nxt-cfg-session-test
      - name: Verify local key cache, randomized states and password-only CLI
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -I. -DHAVE_NXTCRYPT nxt-crypto.cpp nxt-file.cpp nxt-legacy.cpp class-blowfish.cpp tests/key-cache-test.cpp $(pkg-config --cflags --libs libsodium) -o /tmp/nxt-key-cache-test
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          printf 'nick testbot\n' > "$dir/plain"
          printf 'test password for local cache\n' > "$dir/pass"
          chmod 600 "$dir/pass"
          /tmp/nxt-crypto-test config encrypt "$dir/plain" --output "$dir/bot.cfg.nxt" --password-file "$dir/pass"
          /usr/bin/time -f "PASSWORD_PEAK_RSS_KB=%M" /tmp/nxt-key-cache-test manual "$dir/bot.cfg.nxt" "$dir/pass"
          /tmp/nxt-key-cache-test create "$dir/bot.cfg.nxt" "$dir/pass"
          test -s "$dir/bot.key"
          test ! -e "$dir/bot.cfg.nxt.nxt-key"
          test "$(stat -c %a "$dir/bot.key")" = 600
          cp "$dir/bot.key" "$dir/state1"
          /tmp/nxt-key-cache-test create "$dir/bot.cfg.nxt" "$dir/pass"
          ! cmp -s "$dir/state1" "$dir/bot.key"
          /usr/bin/time -f "CACHE_PEAK_RSS_KB=%M" /tmp/nxt-key-cache-test cached "$dir/bot.cfg.nxt" "$dir/pass" </dev/null
          if /tmp/nxt-crypto-test config decrypt "$dir/bot.cfg.nxt" --output "$dir/forbidden" </dev/null; then exit 1; fi
          test ! -e "$dir/forbidden"
          # Independent cache files allow multiple bots in the same directory.
          /tmp/nxt-crypto-test config encrypt "$dir/plain" --output "$dir/bot2.cfg.nxt" --password-file "$dir/pass"
          /tmp/nxt-key-cache-test create "$dir/bot2.cfg.nxt" "$dir/pass"
          test -s "$dir/bot2.key"
          # An uppercase extension still derives a consistent cache name.
          cp "$dir/bot.cfg.nxt" "$dir/UPPER.CFG.NXT"
          /tmp/nxt-key-cache-test create "$dir/UPPER.CFG.NXT" "$dir/pass"
          test -s "$dir/UPPER.key"
          test ! -e "$dir/UPPER.CFG.NXT.key"
          /tmp/nxt-key-cache-test cached "$dir/UPPER.CFG.NXT" "$dir/pass" </dev/null
          /tmp/nxt-key-cache-test cached "$dir/bot.cfg.nxt" "$dir/pass" </dev/null
          /tmp/nxt-key-cache-test cached "$dir/bot2.cfg.nxt" "$dir/pass" </dev/null
          rm "$dir/bot.key"
          if /tmp/nxt-key-cache-test cached "$dir/bot.cfg.nxt" "$dir/pass" </dev/null; then exit 1; fi
      - name: First encrypted replica, unattended restart and first save
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/fresh" "$root/manual" "$root/older" "$root/plain"
          for dir in "$root/fresh" "$root/manual" "$root/older" "$root/plain"; do
            printf 'nick testbot\n' > "$dir/config"
            printf 'bootstrap-integration-pass\n' > "$dir/pass"
            chmod 600 "$dir/pass"
            /tmp/nxt-crypto-test config encrypt "$dir/config" --output "$dir/bot.cfg.nxt" --password-file "$dir/pass"
          done
          /tmp/nxt-ul-bootstrap-test create "$root/fresh/bot.cfg.nxt" "$root/fresh/bot.ul.nxt" "$root/fresh/pass" 0
          test -s "$root/fresh/bot.key"
          test ! -e "$root/fresh/bot.ul.nxt"
          /tmp/nxt-ul-bootstrap-test cached "$root/fresh/bot.cfg.nxt" "$root/fresh/bot.ul.nxt" "$root/fresh/pass" 0 </dev/null
          test ! -e "$root/fresh/bot.ul.nxt"
          /tmp/nxt-ul-bootstrap-test cached "$root/fresh/bot.cfg.nxt" "$root/fresh/bot.ul.nxt" "$root/fresh/pass" 1000000 </dev/null
          test "$(head -c 8 "$root/fresh/bot.ul.nxt")" = NXTCRYPT
          /tmp/nxt-crypto-test userlist decrypt "$root/fresh/bot.ul.nxt" --output "$root/fresh/recovered" --password-file "$root/fresh/pass"
          grep -q 'synthetic userlist' "$root/fresh/recovered"
          /tmp/nxt-ul-bootstrap-test manual "$root/manual/bot.cfg.nxt" "$root/manual/bot.ul.nxt" "$root/manual/pass" 1024
          test ! -e "$root/manual/bot.key"
          /tmp/nxt-key-cache-test create "$root/older/bot.cfg.nxt" "$root/older/pass"
          /tmp/nxt-ul-bootstrap-test create "$root/older/bot.cfg.nxt" "$root/older/bot.ul.nxt" "$root/older/pass" 0
          /tmp/nxt-ul-bootstrap-test cached "$root/older/bot.cfg.nxt" "$root/older/bot.ul.nxt" "$root/older/pass" 256 </dev/null
          /tmp/nxt-ul-bootstrap-test plain "$root/plain/bot.cfg.nxt" "$root/plain/bot.ul" "$root/plain/pass" 0
          echo NXT_UL_BOOTSTRAP_OK
      - name: Legacy Blowfish decoding, seed.h, ELF binary extraction and direct NXT migration
        run: sh tests/test-nxt-legacy.sh /tmp/nxt-crypto-test /tmp/old-psotnic-0 /tmp/old-psotnic-1 /tmp/old-psotnic-2
  proxy-protocol:
    name: SOCKS5 and HTTP CONNECT protocol regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build proxy state machine test
        run: g++ -std=c++11 -O2 -Wall -Wextra -Werror nxt-proxy.cpp tests/test-nxt-proxy.cpp -o /tmp/nxt-proxy-test
      - name: Validate fragmented handshakes, auth, IPv6 and fail-closed behavior
        run: /tmp/nxt-proxy-test
  no-adns-build:
    name: No-ADNS build (proxy-safe destination DNS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config build-essential perl
      - name: Compile without asynchronous DNS
        run: |
          perl configure --enable-nxtcrypt --disable-adns --disable-modules
          make dynamic
      - name: Verify remote target names stay unresolved locally without ADNS
        run: python3 tests/test-nxt-proxy-integration.py ./bin/psotnic
  debug-build:
    name: Debug build - historical -d and real IRC smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev build-essential perl
      - name: Compile HAVE_DEBUG binary
        run: |
          perl configure --enable-nxtcrypt --disable-modules
          make debug
      - name: Verify debug-only CLI and run live loopback IRC tests
        run: |
          ./bin/psotnic -h | grep -q 'Legacy decrypted-config debug flag'
          python3 tests/test-nxt-debug-foreground.py ./bin/psotnic

  bot-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config build-essential perl
      - name: Configure Psotnic without pkg-config
        run: |
          # Force pkg-config to fail if accidentally invoked: the native
          # C++ compile+link probe must find libsodium without it.
          mkdir -p /tmp/nxt-no-pkgconfig
          printf '#!/bin/sh\necho "configure must not invoke pkg-config" >&2\nexit 99\n' > /tmp/nxt-no-pkgconfig/pkg-config
          chmod +x /tmp/nxt-no-pkgconfig/pkg-config
          PATH="/tmp/nxt-no-pkgconfig:$PATH" perl configure --enable-nxtcrypt --disable-modules
          grep -q -- '-lsodium' Makefile.dynamic
      - name: Compile Psotnic
        run: make dynamic
      - name: Integrated bot CLI smoke test (without IRC network)
        run: |
          g++ -std=c++11 -O0 -I. class-blowfish.cpp tests/legacy-fixture.cpp -o /tmp/legacy-smoke-fixture
          /tmp/legacy-smoke-fixture /tmp/legacy-smoke-old.cfg
          ./bin/psotnic config import /tmp/legacy-smoke-old.cfg --seed-file tests/fixtures/legacy-seed.h --preview > /tmp/legacy-smoke-preview.cfg
          grep -q 'nick legacybot' /tmp/legacy-smoke-preview.cfg
          ./bin/psotnic config import /tmp/legacy-smoke-old.cfg --binary /tmp/legacy-smoke-fixture --output /tmp/legacy-smoke-new.nxt --to nxt --password 'synthetic CI password for smoke test'
          ./bin/psotnic config decrypt /tmp/legacy-smoke-new.nxt --output /tmp/legacy-smoke-recovered.cfg --password 'synthetic CI password for smoke test'
          cmp /tmp/legacy-smoke-preview.cfg /tmp/legacy-smoke-recovered.cfg

      - name: Verify short startup hints, full help and context-aware commands
        run: |
          ./bin/psotnic > /tmp/nxt-quick.txt
          ./bin/psotnic -h > /tmp/nxt-help.txt
          ./bin/psotnic --help > /tmp/nxt-long-help.txt
          ./bin/psotnic help > /tmp/nxt-help-alias.txt
          cmp /tmp/nxt-help.txt /tmp/nxt-long-help.txt
          cmp /tmp/nxt-help.txt /tmp/nxt-help-alias.txt
          test -z "$(head -n 1 /tmp/nxt-quick.txt)"
          test "$(sed -n '2p' /tmp/nxt-quick.txt)" = ':: nxt-psotnic :: 0.1.0-dev'
          grep -q 'File tools:' /tmp/nxt-quick.txt
          grep -q 'Supports legacy gay-psotnic files.' /tmp/nxt-quick.txt
          if [ "$(wc -l < /tmp/nxt-quick.txt)" -gt 18 ]; then
            echo 'Bare invocation is not concise'; exit 1
          fi
          if grep -q 'proxy-type' /tmp/nxt-quick.txt; then
            echo 'Bare invocation unexpectedly printed full help'; exit 1
          fi
          if cmp -s /tmp/nxt-quick.txt /tmp/nxt-help.txt; then
            echo 'Short help and full help are identical'; exit 1
          fi
          grep -q -- '--key-cache' /tmp/nxt-help.txt
          grep -q -- '--foreground' /tmp/nxt-help.txt
          grep -q 'config --help' /tmp/nxt-help.txt
          ./bin/psotnic config --help > /tmp/nxt-config-help.txt
          ./bin/psotnic config > /tmp/nxt-config-bare.txt
          ./bin/psotnic help config > /tmp/nxt-config-alias.txt
          cmp /tmp/nxt-config-help.txt /tmp/nxt-config-bare.txt
          cmp /tmp/nxt-config-help.txt /tmp/nxt-config-alias.txt
          grep -q 'config <command>' /tmp/nxt-config-help.txt
          ./bin/psotnic config import > /tmp/nxt-import-help.txt
          ./bin/psotnic config import --help > /tmp/nxt-import-flag-help.txt
          cmp /tmp/nxt-import-help.txt /tmp/nxt-import-flag-help.txt
          grep -q 'Encrypted output prompts for a new password.' /tmp/nxt-import-help.txt
          ./bin/psotnic config encrypt > /tmp/nxt-encrypt-help.txt
          grep -q 'Destination (.nxt added if missing)' /tmp/nxt-encrypt-help.txt
          ./bin/psotnic userlist --help > /tmp/nxt-ul-help.txt
          ./bin/psotnic userlist > /tmp/nxt-ul-bare.txt
          ./bin/psotnic help userlist > /tmp/nxt-ul-alias.txt
          cmp /tmp/nxt-ul-help.txt /tmp/nxt-ul-bare.txt
          cmp /tmp/nxt-ul-help.txt /tmp/nxt-ul-alias.txt
          grep -q 'userlist <command>' /tmp/nxt-ul-help.txt
          ./bin/psotnic userlist import > /tmp/nxt-ul-import-help.txt
          ./bin/psotnic userlist import --help > /tmp/nxt-ul-import-flag-help.txt
          cmp /tmp/nxt-ul-import-help.txt /tmp/nxt-ul-import-flag-help.txt
          if cmp -s /tmp/nxt-config-help.txt /tmp/nxt-ul-help.txt; then
            echo 'Contextual help must not be identical'; exit 1
          fi
          ./bin/psotnic -v > /tmp/nxt-v.txt
          ./bin/psotnic --version > /tmp/nxt-version.txt
          grep -Fxq ':: nxt-psotnic :: 0.1.0-dev' /tmp/nxt-v.txt
          cmp /tmp/nxt-v.txt /tmp/nxt-version.txt
          test "$(sed -n '2p' /tmp/nxt-quick.txt)" = "$(sed -n '2p' /tmp/nxt-v.txt)"
          if ./bin/psotnic -not-an-option > /tmp/nxt-badout 2>&1; then
            echo 'Unknown option unexpectedly succeeded'; exit 1
          fi
          grep -q 'Unknown option:' /tmp/nxt-badout
          if grep -q 'Loading plaintext config' /tmp/nxt-badout; then
            echo 'Unknown option was incorrectly treated as config'; exit 1
          fi
      - name: Verify compact startup banner, original credits and ANSI safety
        run: python3 tests/test-nxt-banner.py ./bin/psotnic
      - name: Exercise real NXT binary through local authenticated SOCKS5 and HTTP CONNECT
        run: python3 tests/test-nxt-proxy-integration.py ./bin/psotnic
      - name: Real foreground -d and classic background end-to-end regression
        run: python3 tests/test-nxt-debug-foreground.py ./bin/psotnic
      - name: Interactive -n/-ne encrypted and plaintext wizard end-to-end tests
        run: python3 tests/test-nxt-wizard.py ./bin/psotnic
      - name: Real MAIN SLAVE LEAF encrypted-userlist bootstrap and idle RSS
        run: python3 tests/test-userlist-bootstrap-live.py ./bin/psotnic
      - name: Verify in-place NXTCRYPT build mode switches rebuild objects
        run: |
          crypto_sha="$(sha256sum functions.o | cut -d' ' -f1)"
          ./configure --disable-modules
          make dynamic
          ! grep -q -- '-lsodium' Makefile.dynamic
          plain_sha="$(sha256sum functions.o | cut -d' ' -f1)"
          test "$plain_sha" != "$crypto_sha"
          ./bin/psotnic config import --help | grep -q 'Plaintext'
          ./configure --enable-nxtcrypt --disable-modules
          make dynamic
          grep -q -- '-lsodium' Makefile.dynamic
          test "$(sha256sum functions.o | cut -d' ' -f1)" != "$plain_sha"
          ./bin/psotnic --help | grep -q -- '--key-cache'

  real-classic-binary:
    name: Recover seed from real upstream gay-psotnic
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NXT fork
        uses: actions/checkout@v4
      - name: Checkout untouched original gay-psotnic at pinned commit
        uses: actions/checkout@v4
        with:
          repository: psotnic/gay-psotnic
          ref: 2bd6db1ecd84bc8f2ae90aae58de5ee3fe0263c2
          path: classic
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config build-essential perl binutils
      - name: Compile actual upstream gay-psotnic binary
        run: |
          test "$(git -C classic rev-parse HEAD)" = "2bd6db1ecd84bc8f2ae90aae58de5ee3fe0263c2"
          cd classic
          perl configure --disable-modules
          make dynamic
          test -x bin/psotnic
          test -s seed.h
          file bin/psotnic
      - name: Compile NXT and legacy ciphertext fixture against original upstream implementation
        run: |
          perl configure --enable-nxtcrypt --disable-modules
          make dynamic
          g++ -std=c++11 -O0 -Iclassic classic/class-blowfish.cpp tests/classic-upstream-fixture.cpp -o /tmp/classic-upstream-fixture
          g++ -std=c++11 -O2 -I. -DHAVE_NXTCRYPT nxt-crypto.cpp nxt-file.cpp nxt-legacy.cpp class-blowfish.cpp tests/ul-session-test.cpp $(pkg-config --cflags --libs libsodium) -o /tmp/nxt-ul-session-test
      - name: Extract cfg seed from actual unstripped and stripped original psotnic binaries
        run: sh tests/test-classic-upstream.sh ./bin/psotnic classic/bin/psotnic /tmp/classic-upstream-fixture
