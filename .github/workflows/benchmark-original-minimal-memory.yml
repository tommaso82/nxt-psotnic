name: Compare original and minimal NXT memory maps
on:
  workflow_dispatch:
  push:
    branches: [devel, 'test/optional-nxtcrypt']
    paths:
      - 'configure'
      - 'tests/test.pm'
      - 'nxt-file.*'
      - 'nxt-crypto.*'
      - 'nxt-legacy.*'
      - 'main.cpp'
      - 'config-load.cpp'
      - 'class-options.cpp'
      - 'class-userlist.cpp'
      - 'class-inet.cpp'
      - '.github/workflows/benchmark-original-minimal-memory.yml'
      - 'tests/benchmark-live-ram.py'
jobs:
  map-comparison:
    name: Live plaintext memory maps - original versus minimal NXT
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout authentic gay-psotnic
        uses: actions/checkout@v4
        with:
          repository: psotnic/gay-psotnic
          ref: 2bd6db1ecd84bc8f2ae90aae58de5ee3fe0263c2
          path: classic
          persist-credentials: false
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential perl libssl-dev
      - name: Build both bots in debug mode, without NXTCRYPT
        shell: bash
        run: |
          set -euo pipefail
          (cd classic && perl configure --disable-modules --disable-adns && make debug)
          g++ -std=c++11 -O2 -Iclassic classic/class-blowfish.cpp tests/bench-live-config.cpp -o /tmp/bench-original-encrypt
          mkdir ../nxt-min
          tar -cf - --exclude=.git --exclude=classic --exclude=bin . | (cd ../nxt-min && tar -xf -)
          (cd ../nxt-min && perl configure --disable-modules --disable-adns && make debug)
      - name: Compare ELF segment sizes and runtime libraries
        run: |
          echo "== gay-psotnic original =="
          size classic/bin/psotnic
          ldd classic/bin/psotnic
          echo "== NXT without NXTCRYPT =="
          size ../nxt-min/bin/psotnic
          ldd ../nxt-min/bin/psotnic
      - name: Measure original versus minimal NXT memory maps (20 live boots)
        run: |
          python3 tests/benchmark-live-ram.py --classic-vs-minimal \
            --classic classic/bin/psotnic \
            --nxt-min ../nxt-min/bin/psotnic \
            --classic-encrypt /tmp/bench-original-encrypt \
            --repeats 5
