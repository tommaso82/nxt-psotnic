name: Live Userlist I/O benchmark
on:
  push:
    branches: [feature/config-crypto-v1]
    paths:
      - tests/bench-userlist-driver.h
      - tests/patch-benchmark.py
      - .github/workflows/benchmark-userlist.yml
  workflow_dispatch:
jobs:
  bench:
    name: Compare authentic gay-psotnic and NXT ul::save
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout original upstream
        uses: actions/checkout@v4
        with:
          repository: psotnic/gay-psotnic
          ref: 2bd6db1ecd84bc8f2ae90aae58de5ee3fe0263c2
          path: classic
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsodium-dev pkg-config perl python3
      - name: Insert benchmark driver into both actual main.cpp implementations (CI workspace only)
        run: |
          mkdir -p classic/tests
          cp tests/bench-userlist-driver.h classic/tests/bench-userlist-driver.h
          python3 tests/patch-benchmark.py classic
          python3 tests/patch-benchmark.py . --new
      - name: Build upstream original and NXT programs
        run: |
          (cd classic && perl configure --disable-modules && make dynamic)
          perl configure --disable-modules
          make dynamic
      - name: Benchmark genuine ul::save with 100/1000/10000 handles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ul-bench
          echo "Host: $(uname -a)"
          echo "CPUs: $(nproc)"
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo)"
          echo "BENCH_HEADER mode users repeats median_us p95_us min_us max_us cpu_median_us bytes rss_before_kib rss_after_kib rss_peak_kib"
          for n in 100 1000 10000; do
            for scenario in "classic plain" "nxt plain" "classic blowfish" "nxt nxt"; do
              set -- $scenario
              flavor="$1"; mode="$2"
              if [ "$flavor" = classic ]; then exe=./classic/bin/psotnic; else exe=./bin/psotnic; fi
              echo "START flavor=$flavor mode=$mode users=$n"
              NXT_BENCH="$mode" NXT_BENCH_COUNT="$n" NXT_BENCH_DEST="/tmp/ul-bench/$flavor-$mode-$n.ul" \
                "$exe" | grep BENCH_RESULT
            done
          done
