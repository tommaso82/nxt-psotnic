name: Live Userlist I/O benchmark
on:
  push:
    branches: [feature/config-crypto-v1, devel]
    paths:
      - class-userlist.cpp
      - class-inet.cpp
      - nxt-crypto.cpp
      - tests/bench-userlist-driver.h
      - tests/patch-benchmark.py
      - .github/workflows/benchmark-userlist.yml
      - tests/validate-benchmark-parity.py
  workflow_dispatch:
jobs:
  bench:
    name: Compare authentic gay-psotnic and NXT ul::save
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout original upstream
        uses: actions/checkout@v4
        with:
          repository: psotnic/gay-psotnic
          ref: 2bd6db1ecd84bc8f2ae90aae58de5ee3fe0263c2
          path: classic
          persist-credentials: false
      - name: Checkout NXT before autosave optimization (pinned)
        uses: actions/checkout@v4
        with:
          ref: 550bda2e7400a5fd8a1db365c6f9039a40e9519d
          path: baseline
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsodium-dev pkg-config perl python3
      - name: Insert benchmark driver into both actual main.cpp implementations (CI workspace only)
        run: |
          mkdir -p classic/tests
          cp tests/bench-userlist-driver.h classic/tests/bench-userlist-driver.h
          python3 tests/patch-benchmark.py classic
          cp tests/bench-userlist-driver.h baseline/tests/bench-userlist-driver.h
          python3 tests/patch-benchmark.py baseline --new
          python3 tests/patch-benchmark.py . --new
      - name: Build upstream original and NXT programs
        run: |
          (cd classic && perl configure --disable-modules && make dynamic)
          (cd baseline && perl configure --disable-modules && make dynamic)
          perl configure --disable-modules
          make dynamic
      # Keep this workflow runnable for each optimization commit and collect
      # a same-runner before/after comparison against original gay-psotnic.
      - name: Benchmark genuine ul::save with 100/1000/10000 handles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ul-bench
          echo "Host: $(uname -a)"
          echo "CPUs: $(nproc)"
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo)"
          echo "BENCH_HEADER mode users repeats median_us p95_us min_us max_us cpu_median_us bytes rss_before_kib rss_after_kib rss_peak_kib"
          for n in 100 1000 10000; do
            for scenario in "classic plain" "baseline plain" "nxt plain" "classic blowfish" "baseline nxt" "nxt nxt"; do
              set -- $scenario
              flavor="$1"; mode="$2"
              if [ "$flavor" = classic ]; then exe=./classic/bin/psotnic; elif [ "$flavor" = baseline ]; then exe=./baseline/bin/psotnic; else exe=./bin/psotnic; fi
              echo "START flavor=$flavor mode=$mode users=$n"
              NXT_BENCH="$mode" NXT_BENCH_COUNT="$n" NXT_BENCH_DEST="/tmp/ul-bench/$flavor-$mode-$n.ul" \
                "$exe" | grep BENCH_RESULT
            done
          done
          echo "SEMANTIC PARITY: check all file metadata including createdBy and hostBy; normalize only process timestamps"
          python3 tests/validate-benchmark-parity.py /tmp/ul-bench


  plaintext-develop:
    name: Plaintext RAM (current devel versus original)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout unchanged upstream gay-psotnic
        uses: actions/checkout@v4
        with:
          repository: psotnic/gay-psotnic
          ref: 2bd6db1ecd84bc8f2ae90aae58de5ee3fe0263c2
          path: classic
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsodium-dev pkg-config perl python3
      - name: Prepare plaintext-only test builds (CI working copies, not committed)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # The original release only opens plaintext cfg via -T in debug builds.
          # Use the existing plaintext code path in a normal optimized build.
          f=Path("classic/functions.cpp")
          s=f.read_text(encoding="latin-1")
          old="config.load(argv[i]);"
          assert s.count(old)==1
          f.write_text(s.replace(old,"config.load(argv[i], true);"),encoding="latin-1")
          f=Path("classic/main.cpp")
          s=f.read_text(encoding="latin-1")
          old="userlist.load(config.userlist_file);"
          assert s.count(old)==1
          f.write_text(s.replace(old,"userlist.load(config.userlist_file, 0);"),encoding="latin-1")
          # Inline memory breakdown in the test-only benchmark driver.
          p=Path("tests/bench-userlist-driver.h")
          s=p.read_text()
          probe=r"""
          static void nxt_plain_mem(const char *phase) {
              FILE *f=fopen("/proc/self/smaps_rollup","r");
              if(!f) return;
              char line[256];long rss=0,pss=0,clean=0,dirty=0;
              while(fgets(line,sizeof line,f)) {
                  long x;
                  if(sscanf(line,"Rss: %ld kB",&x)==1) rss=x;
                  else if(sscanf(line,"Pss: %ld kB",&x)==1) pss=x;
                  else if(sscanf(line,"Private_Clean: %ld kB",&x)==1) clean=x;
                  else if(sscanf(line,"Private_Dirty: %ld kB",&x)==1) dirty=x;
              }
              fclose(f);
              printf("PLAIN_MEM phase=%s users=%s rss=%ld pss=%ld uss=%ld\n",
                     phase,getenv("NXT_BENCH_COUNT"),rss,pss,clean+dirty);
          }
          """
          start="static int nxt_userlist_benchmark(void) {"
          assert s.count(start)==1
          s=s.replace(start,probe+"\n"+start)
          point="    const long before=nxt_bench_rss_kib();"
          assert s.count(point)==1
          s=s.replace(point,point+'\n    nxt_plain_mem("warmed");')
          point="    return 0;\n}\n#endif"
          assert s.count(point)==1
          s=s.replace(point,'    nxt_plain_mem("after_save");\n'+point)
          p.write_text(s)
          PY
          cp tests/bench-userlist-driver.h classic/tests/bench-userlist-driver.h
          python3 tests/patch-benchmark.py classic
          python3 tests/patch-benchmark.py . --new
      - name: Compile both bots with comparable release flags
        shell: bash
        run: |
          set -euo pipefail
          (cd classic && perl configure --disable-modules && make dynamic)
          perl configure --disable-modules
          make dynamic
          echo "BUILD_COMPARE classic_sha=2bd6db1e nxt_sha=$(git rev-parse HEAD)"
          size classic/bin/psotnic bin/psotnic
      - name: Plaintext userlist save and process RSS PSS USS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/plain-compare
          for n in 100 1000 10000; do
            for flavor in classic nxt; do
              exe=./bin/psotnic
              if [ "$flavor" = classic ]; then exe=./classic/bin/psotnic; fi
              echo "PLAIN_COMPARE flavor=$flavor users=$n"
              NXT_BENCH=plain NXT_BENCH_COUNT="$n" NXT_BENCH_DEST="/tmp/plain-compare/$flavor-$n.ul" "$exe" | grep -E '^(PLAIN_MEM|BENCH_RESULT)'
            done
          done
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"tests")
          from importlib.machinery import SourceFileLoader
          mod=SourceFileLoader("verify","tests/validate-benchmark-parity.py").load_module()
          root=Path("/tmp/plain-compare")
          for n in (100,1000,10000):
              assert mod.normalize(root/f"classic-{n}.ul",n)==mod.normalize(root/f"nxt-{n}.ul",n)
              print(f"PLAIN_PARITY_OK users={n}")
          PY
      - name: Actual plaintext startup and steady-state process memory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, socket, subprocess, tempfile, time
          from pathlib import Path
          source=Path("/tmp/plain-compare")
          executables={"classic":str(Path("classic/bin/psotnic").resolve()),
                       "nxt":str(Path("bin/psotnic").resolve())}
          def memory(pid):
              result={}
              with open(f"/proc/{pid}/smaps_rollup") as f:
                  for line in f:
                      if ":" not in line: continue
                      k,v=line.split(":",1)
                      if k in ("Rss","Pss","Private_Clean","Private_Dirty","Anonymous"):
                          result[k]=int(v.strip().split()[0])
              result["Uss"]=result["Private_Clean"]+result["Private_Dirty"]
              return result
          for n in (100,1000,10000):
              for flavor in ("classic","nxt"):
                  with tempfile.TemporaryDirectory(prefix=f"plain-{flavor}-{n}-") as d:
                      folder=Path(d)
                      (folder/"bot.ul").write_bytes((source/f"{flavor}-{n}.ul").read_bytes())
                      with socket.socket() as server:
                          server.bind(("127.0.0.1",0))
                          server.listen(1)
                          server.settimeout(8)
                          port=server.getsockname()[1]
                          (folder/"bot.cfg").write_text(
                              "nick nxtbot\nident nxtbot\nhandle nxtbot\n"
                              "hub 127.0.0.1 1 testingpass mainhub\n"
                              f"server 127.0.0.1 {port}\n"
                              "userlist bot.ul\nsave-userlist ON\ndontfork ON\n")
                          p=subprocess.Popen([executables[flavor],"bot.cfg"],
                              cwd=d,stdin=subprocess.DEVNULL,
                              stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
                          conn=None
                          try:
                              conn,_=server.accept()
                              conn.settimeout(3)
                              data=conn.recv(4096)
                              if b"NICK " not in data and b"CAP LS" not in data:
                                  raise RuntimeError(f"IRC registration missing: {data!r}")
                              # Check stable resident usage while the actual bot is alive.
                              records=[]
                              for _ in range(3):
                                  time.sleep(.25)
                                  if p.poll() is not None:
                                      raise RuntimeError(f"Exited rc={p.returncode} stderr={p.stderr.read()!r}")
                                  records.append(memory(p.pid))
                              median=lambda k:sorted(x[k] for x in records)[1]
                              print("RUNTIME_PLAIN flavor=%s users=%d rss=%d pss=%d uss=%d anonymous=%d" %
                                  (flavor,n,median("Rss"),median("Pss"),median("Uss"),median("Anonymous")),flush=True)
                          finally:
                              if conn:conn.close()
                              if p.poll() is None:p.kill()
                              p.communicate(timeout=4)
          PY
